name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # node:sqlite
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Unit + integration tests (router, reminders, memory, security)
        run: npm test
      - name: Memory eval wiring check (fake embeddings, no Ollama)
        run: npm run eval:memory -- --no-write
        env:
          EMBED_FAKE: "1"

  voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Voice tests — wake matching, conversation loop, noise floor (stdlib only; audio replay skips)
        run: python -m unittest discover -s tests -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
